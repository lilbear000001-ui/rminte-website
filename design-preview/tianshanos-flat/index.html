/* Layout: 左侧一摞 WebGL 玻璃板，银白的光在玻璃里承载含义；右侧三条主题。沿用 RMinte 设计系统 v2：黑、石墨、银白，蓝宝石只作细点缀 */
:root{
  --n0:#000;--t1:#F2F4F6;--t2:#B6BCC4;--t3:#858C95;
  --line1:rgba(255,255,255,.08);--sap3:#A8B8F0;
  --ui:'Geist','Noto Sans SC',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;
  --settle:cubic-bezier(.2,.8,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--n0);color:var(--t1);font-family:var(--ui);margin:0;padding-inline:max(16px,4vw);padding-block:56px 72px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto}
.eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--t2)}
.eyebrow svg{width:12px;height:12px}
h1{font-size:clamp(34px,5.2vw,64px);font-weight:500;letter-spacing:-.045em;line-height:1.05;margin:22px 0 18px;text-wrap:balance}
.lead{max-width:640px;font-size:17px;line-height:1.85;color:var(--t2);margin:0}
.exp{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr);gap:clamp(24px,4vw,64px);align-items:center;margin-top:24px}
.topic{border-bottom:1px solid var(--line1);padding:24px 0}
.topic:first-child{padding-top:0}.topic:last-child{border-bottom:0;padding-bottom:0}
.topic h3{margin:0;font:inherit}
.tg{all:unset;box-sizing:border-box;display:flex;width:100%;align-items:center;justify-content:space-between;gap:20px;cursor:pointer;font:500 21px/1.5 var(--ui);letter-spacing:-.015em;color:var(--t3);transition:color 200ms}
.tg:hover,.tg[aria-expanded=true]{color:var(--t1)}
.tg:focus-visible{outline:2px solid var(--sap3);outline-offset:6px;border-radius:2px}

 if(t==='c')return r(-w*.4,-hh*.38,w*.4,hh*.6)+r(w*.05,-hh*.38,w*.14,hh*.6)+r(w*.24,-hh*.38,w*.14,hh*.6);

 if(t==='w')return r(-w*.4,-hh*.36,w*.2,hh*.24)+r(w*.2,-hh*.36,w*.2,hh*.24)+r(-w*.4,-hh*.04,w*.2,hh*.24)+r(w*.2,-hh*.04,w*.2,hh*.24)+r(-w*.14,-hh*.24,w*.28,hh*.36);
 return r(-w*.38,-hh*.3,w*.34,hh*.34)+r(w*.04,-hh*.3,w*.34,hh*.34)}

 let pins='';if(false){const n=t==='c'?7:t==='w'?6:t==='m'?5:4;for(let i=0;i<n;i++){const u=-w/2+w*(.14+.72*i/(n-1));pins+=`<path class="pin" d="M${u} ${-hh/2-6}v6M${u} ${hh/2}v6"/>`;if(t!=='s'){const v=-hh/2+hh*(.14+.72*i/(n-1));pins+=`<path class="pin" d="M${-w/2-6} ${v}h6M${w/2} ${v}h6"/>`}}}

[9,18,27].forEach((o,i)=>h+=`<rect class="fr" data-fr="${i}" x="${645-35-o}" y="${135-16-o}" width="${70+o*2}" height="${32+o*2}" rx="${9+o*.6}"/>`);

for(const k in R){const p=R[k];h+=`<path class="sw" data-sw="${k}" style="animation-delay:${-(k.length*.37%4).toFixed(2)}s" d="${d(p)}"/>`;[p[0],p[p.length-1]].forEach(q=>h+=`<circle class="pad" data-pad="${k}" cx="${q[0]}" cy="${q[1]}" r="2.4"/>`)}

let px=0,py=0,tx=0,ty=0;const stg=document.getElementById('stage');
stg.addEventListener('pointermove',e=>{if(reduce)return;const r=stg.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5});

function par(){px+=(tx-px)*.08;py+=(ty-py)*.08;gW.style.transform=`translate(${(px*3).toFixed(2)}px,${(py*3).toFixed(2)}px)`;gN.style.transform=`translate(${(px*11).toFixed(2)}px,${(py*9).toFixed(2)}px)`;gC.style.transform=`translate(${(px*15).toFixed(2)}px,${(py*12).toFixed(2)}px)`;

const rp={};for(const k in R){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d(R[k]));rp[k]={p,l:p.getTotalLength()}}

 if(s!==3||reduce){sv.querySelectorAll('.mk,.mkc').forEach(e=>e.classList.toggle('show',s===3&&reduce));if(s===3&&reduce){FOC[3].p.forEach(k=>nd(k).classList.add('on'));wr('management-spi').concat(wr('management-network')).forEach(w=>w.classList.add('on'))}}}

 for(let i=0;i<7;i++){pk(i).style.opacity=0}
