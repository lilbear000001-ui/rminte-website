:root{--n-2:#0d0f12;--n-3:#14171b;--line:rgba(235,238,240,.13);--line-1:rgba(255,255,255,.08);--line-3:rgba(255,255,255,.24);--ink:#f2f4f6;--ink-soft:#cbd0d4;--muted:#a9adb2;--dim:#969da3;--motion:cubic-bezier(.32,.72,0,1)}
*{box-sizing:border-box}body{margin:0;background:#000;color:var(--ink);font-family:Geist,"Noto Sans SC",sans-serif;padding:40px 48px 80px}
.bar{position:sticky;top:0;z-index:5;background:#000;padding:0 0 16px;font-size:13px;color:var(--muted)}
.bar b{color:var(--ink);font-weight:500}.bar input{vertical-align:middle;width:180px}
section{margin-bottom:56px}h3{margin:0 0 18px;font-size:14px;font-weight:500;color:var(--ink-soft);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;max-width:1280px}
[data-bevel]{position:relative;--bx:50%;--bw:30%;--ba:.5;--bi:16px}
[data-bevel]::before{content:"";position:absolute;top:0;left:var(--bi);right:var(--bi);height:1px;pointer-events:none;background:linear-gradient(90deg,rgba(255,255,255,0) calc(var(--bx) - var(--bw)),rgba(255,255,255,var(--ba)) var(--bx),rgba(255,255,255,0) calc(var(--bx) + var(--bw)))}
.cc{display:flex;flex-direction:column;min-width:0;padding:22px 24px;text-align:left;color:var(--ink);font:inherit;background:var(--n-2);border:1px solid var(--line);border-radius:16px;cursor:pointer;transition:border-color .24s var(--motion),transform .24s var(--motion)}
.cc[aria-expanded=true]{background:var(--n-3);border-color:var(--line-3)}
.cc:hover{border-color:var(--line-3);transform:translateY(-1px)}
.ind{display:flex;align-items:center;gap:14px;color:var(--ink-soft);font-size:13px;line-height:1.65}.ind svg{width:22px;height:22px;color:#cbd0d4;flex:none}
.tk{display:block;margin:14px 0 8px;font-size:22px;font-weight:500;line-height:1.5;letter-spacing:-.02em}
.out{display:flex;flex-wrap:wrap;gap:2px 16px;margin-top:auto;color:var(--muted);font-size:14px;line-height:1.8}
.op{display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding-top:12px;border-top:1px solid var(--line-1);color:var(--ink-soft);font-size:14px}.op svg{width:18px;height:18px;color:var(--dim)}
.a .cc{--ba:.5}
.b .cc{--ba:var(--rest,.18);transition:border-color .24s var(--motion),transform .24s var(--motion),--ba .24s}
.b .cc:hover,.b .cc[aria-expanded=true]{--ba:.5}
.c .cc::before{display:none}
@property --ba{syntax:"<number>";inherits:true;initial-value:.5}

const r=document.getElementById('r');r.oninput=()=>{const v=r.value/100;document.getElementById('v').textContent=v.toFixed(2);document.querySelectorAll('.b .cc').forEach(x=>x.style.setProperty('--rest',v));document.documentElement.style.setProperty('--rest',v)};
